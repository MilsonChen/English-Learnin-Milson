<style>
:root {

}
html[data-theme="dark"] {
  --bg: #0e1014; --panel: #181b21; --fg: #e9ecf1; --muted: #98a1af;
  --line: #262b34; --line-soft: #20242c;
  --accent: #5b8bff; --accent-soft: #1c2740;
  --ok: #3ecf7a; --ok-soft: #16301f;
  --fuzzy: #f0a132; --fuzzy-soft: #33260f;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-tap-highlight-color: transparent;

  transition: background .2s ease, color .2s ease;
}
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
code { background: var(--line-soft); border-radius: 5px; padding: 1px 5px; font-size: 13px; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: calc(10px + env(safe-area-inset-top))
           max(12px, env(safe-area-inset-right)) 10px
           max(12px, env(safe-area-inset-left));
}
.brand { margin-right: auto; font-size: 17px; font-weight: 700; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--fg); font-size: 14px; white-space: nowrap;
}
.tool.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.stage {
  display: flex; flex-direction: column; gap: 14px;
  max-width: 720px; margin: 0 auto;
  padding: 14px max(14px, env(safe-area-inset-left)) 14px max(14px, env(safe-area-inset-right));
}
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
}
.panel.center { text-align: center; }
.footer {
  max-width: 720px; margin: 0 auto;
  padding: 8px 14px calc(24px + env(safe-area-inset-bottom));
  color: var(--muted); font-size: 12px; line-height: 1.8; text-align: center;
}
.footer p { margin: 2px 0; }
.meta { margin: 6px 0; color: var(--muted); font-size: 13px; }
.meta.center { text-align: center; }
.big { font-size: 18px; font-weight: 600; }

.primary {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); padding: 0 20px; border: none; border-radius: 14px;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
}
.ghost {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 16px; border: 1px solid var(--line);
  border-radius: 14px; background: transparent; color: var(--fg); font-size: 15px;
}
.ghost.small { min-height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; }
.actions { display: flex; gap: 10px; margin-top: 14px; }
.actions.wrap { flex-wrap: wrap; }
.actions > * { flex: 1 1 auto; }
.panel.cue > .primary.big { width: 100%; margin-top: 8px; }

.eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
.cue-title { margin: 0 0 10px; font-size: clamp(22px, 6vw, 30px); line-height: 1.25; }
.cue-prompt { margin: 0 0 8px; font-size: 17px; }
.cue-list { margin: 12px 0 4px; border-top: 1px solid var(--line-soft); }
.cue-row { padding: 10px 2px; border-bottom: 1px solid var(--line-soft); }
.cue-en { font-size: 17px; font-weight: 600; }
.cue-zh { opacity: .88; }
.cue-note { color: var(--muted); font-size: 13px; }

.panel.cardpanel {
  display: flex; flex-direction: column; gap: 10px;
  padding: 0; border: none; border-radius: 0; background: transparent; box-shadow: none;
}
.cardbar { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }
.bar { height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
.card {
  display: flex; flex-direction: column; justify-content: center; gap: 14px;
  min-height: 46vh; padding: 26px 20px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow); touch-action: pan-y;
  transition: transform .18s ease, opacity .18s ease, border-color .15s ease;
  will-change: transform; -webkit-user-select: none; user-select: none;
}
.card.dragging { transition: none; }
.card .face { text-align: center; }
.label { margin: 0 0 6px; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.word { margin: 0; font-size: clamp(26px, 7.5vw, 40px); font-weight: 700; line-height: 1.22; word-break: break-word; }
.word.small { font-size: clamp(20px, 5.5vw, 28px); }
.answer { padding-top: 14px; border-top: 1px dashed var(--line); text-align: center; animation: pop .18s ease; }
.phon { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.note { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
.hint { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
.card.swipe-ok { border-color: var(--ok); }
.card.swipe-miss { border-color: var(--miss); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.judge { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.judge .j {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--tap); border: 1px solid transparent; border-radius: 14px;
  font-size: 16px; font-weight: 600;
}
.judge .j:active { transform: scale(.98); }
.judge .j kbd {
  padding: 0 4px; border: 1px solid currentColor; border-radius: 5px;
  font-family: inherit; font-size: 11px; opacity: .5;
}
.judge .miss  { background: var(--miss-soft);  color: var(--miss); }
.judge .fuzzy { background: var(--fuzzy-soft); color: var(--fuzzy); }
.judge .ok    { background: var(--ok-soft);    color: var(--ok); }

.done-emoji { margin: 0 0 6px; font-size: 40px; }
.hardlist { margin: 16px 0 0; text-align: left; }
.hard-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.hr-en { font-weight: 600; }
.hr-zh { flex: 1; color: var(--muted); }
.hr-bad { color: var(--muted); font-size: 12px; }
.errlist { padding-left: 20px; color: var(--miss); font-size: 14px; }

.search {
  width: 100%; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--fg); font-size: 16px;
  -webkit-appearance: none; appearance: none;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  min-height: 36px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600;
}
.chip.off { border-color: var(--line); background: transparent; color: var(--muted); text-decoration: line-through; }
.filetitle { margin: 18px 4px 6px; color: var(--muted); font-size: 15px; font-weight: 600; }
.chapter { margin: 18px 4px 8px; padding-left: 10px; border-left: 3px solid var(--accent); font-size: 17px; }
details.group {
  margin-bottom: 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
details.group > summary {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 14px;
  font-size: 16px; font-weight: 600; cursor: pointer; list-style: none;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::before { content: "▸"; color: var(--muted); transition: transform .15s ease; }
details.group[open] > summary::before { transform: rotate(90deg); }
.g-name { flex: 1; }
.g-meta { color: var(--muted); font-size: 12px; font-weight: 400; }
.g-prompt { margin: 0 14px 6px; color: var(--muted); font-size: 14px; }
.g-actions { padding: 0 14px 8px; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.libtable { width: 100%; border-collapse: collapse; font-size: 15px; }
.libtable td { padding: 9px 12px; border-top: 1px solid var(--line-soft); vertical-align: top; }
.c-en { font-weight: 600; }
.c-zh { opacity: .88; }
.c-note { color: var(--muted); font-size: 13px; }
.mask-en .c-en, .mask-zh .c-zh, .mask-note .c-note {
  filter: blur(6px); cursor: pointer; -webkit-user-select: none; user-select: none;
}
.mask-en .c-en.revealed, .mask-zh .c-zh.revealed, .mask-note .c-note.revealed { filter: none; }

@media (max-width: 600px) {
  .libtable, .libtable tbody, .libtable tr, .libtable td { display: block; width: auto; }
  .libtable tr { padding: 10px 14px; border-top: 1px solid var(--line-soft); }
  .libtable td { padding: 1px 0; border: none; }
  .c-en { font-size: 16px; }
  .c-note { font-size: 13px; }
  .tool { padding: 0 10px; font-size: 13px; }
  .brand { font-size: 15px; }
}
@media (min-width: 720px) {
  .stage { gap: 16px; padding-top: 20px; }
  .panel { padding: 22px; }
  .card { min-height: 340px; padding: 36px; }
  .footer { font-size: 13px; }
  .tool:hover { border-color: var(--accent); color: var(--accent); }
  .primary:hover { filter: brightness(1.06); }
  .judge .j:hover { border-color: currentColor; }
  details.group > summary:hover { background: var(--line-soft); }
}
</style>

## C1 Arcane

| 英文 | 中文翻译 | 注解 |

| meme | 梗、表情包 | 网络流行梗，表情包 |

| sabotage | 蓄意破坏 | 故意损毁设施、阻挠计划 |

| to work it out ~ fix a problem | 解决问题 | 短语，理清、搞定难题 |
| manipulate | 操纵 | 操控人/局势，带贬义 |

  /* ------------------------------------------------------- 本机进度存储 */

  var STORE_KEY = 'engReview.v1';
  var cache = null;

  function store() {
    if (cache) { return cache; }
    try { cache = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { cache = {}; }
    cache.groups = cache.groups || {};
    cache.items = cache.items || {};
    cache.settings = cache.settings || {};
    return cache;
  }
  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cache)); } catch (e) { /* 无痕模式忽略 */ }
  }
  function setting(name, dflt) {
    var s = store().settings;
    return Object.prototype.hasOwnProperty.call(s, name) ? s[name] : dflt;
  }
  function setSetting(name, value) { store().settings[name] = value; saveStore(); }
  function groupStat(key) { return store().groups[key] || { runs: 0, lastAt: 0 }; }
  function recordGroup(key) {
    var s = store();
    var g = s.groups[key] || (s.groups[key] = { runs: 0, lastAt: 0 });
    g.runs++; g.lastAt = Date.now(); saveStore();
  }
  function itemStat(key, en) {
    return store().items[key + '||' + en] || { ok: 0, fuzzy: 0, miss: 0, lastAt: 0 };
  }
  function recordItem(key, en, level) {
    var s = store();
    var k = key + '||' + en;
    var r = s.items[k] || (s.items[k] = { ok: 0, fuzzy: 0, miss: 0, lastAt: 0 });
    if (level === 'ok') { r.ok++; } else if (level === 'fuzzy') { r.fuzzy++; } else { r.miss++; }
    r.lastAt = Date.now(); saveStore();
  }

  /* --------------------------------------------------------- 解析词库 */
  /* # 文档名 / ## 章节 / ### 板块 / 表格一行一张卡 / 可选 > 提示：… */

  var SEP_CELL = /^:?-{2,}:?$/;
  var HEADER_EN = /^(英文|英语|单词|词条|English|Word|Phrase)$/i;
  var PHON_HEAD = /^((?:\s*\/[^\/\n]{1,40}\/\s*[，,、]?)+)/;

  function splitRow(line) {
    var s = line.trim();
    if (s.charAt(0) === '|') { s = s.slice(1); }
    if (s.length && s.charAt(s.length - 1) === '|') { s = s.slice(0, -1); }
    return s.split('|').map(clean);
  }
  function isSeparatorRow(cells) {
    var n = 0;
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i].replace(/\s/g, '');
      if (!c) { continue; }
      if (!SEP_CELL.test(c)) { return false; }
      n++;
    }
    return n > 0;
  }
  function isHeaderRow(cells) { return cells.length >= 2 && HEADER_EN.test(cells[0]); }

  /* 把开头的音标剥出来："/raɪ/，rye toast简写" → { phonetic:"/raɪ/", text:"rye toast简写" } */
  function splitPhonetic(text) {
    var s = clean(text);
    var m = PHON_HEAD.exec(s);
    if (!m) { return { phonetic: '', text: s }; }
    var phonetic = m[1].replace(/[，,、]\s*$/, '').replace(/\s+/g, ' ').trim();
    var rest = s.slice(m[0].length).replace(/^[，,、\s]+/, '').trim();
    return { phonetic: phonetic, text: rest };
  }

  function parseMarkdown(text, sourceName) {
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    var docTitle = String(sourceName || '').replace(/\.(md|markdown|txt)$/i, '');
    var chapters = [], chapter = null, group = null, tableRow = -1;

    function ensureChapter() {
      if (!chapter) { chapter = { name: docTitle, groups: [] }; chapters.push(chapter); }
      return chapter;
    }
    function ensureGroup(name) {
      var ch = ensureChapter();
      group = { name: name, chapter: ch.name, doc: docTitle, prompt: '', items: [] };
      ch.groups.push(group);
      return group;
    }
    function addItem(g, cells) {
      var en = cells[0] || '';
      if (!en) { return; }
      var note = cells.length > 3 ? cells.slice(2).filter(Boolean).join(' · ') : (cells[2] || '');
      var pe = splitPhonetic(en);
      var pn = splitPhonetic(note);
      g.items.push({
        en: pe.text || en,
        zh: cells[1] || '',
        note: pn.text,
        phonetic: pe.phonetic || pn.phonetic
      });
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) { tableRow = -1; continue; }

      var h = /^(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
      if (h) {
        tableRow = -1;
        var level = h[1].length, name = clean(h[2]);
        if (level === 1) { docTitle = name; continue; }
        if (level === 2) { chapter = { name: name, groups: [] }; chapters.push(chapter); group = null; continue; }
        ensureChapter(); ensureGroup(name); continue;
      }

      if (line.charAt(0) === '|') {
        var cells = splitRow(line);
        var idx = (tableRow < 0) ? 0 : tableRow + 1;
        tableRow = idx;
        if (isSeparatorRow(cells)) { continue; }
        if (idx === 0 && isHeaderRow(cells)) { continue; }
        if (!group) { ensureGroup(chapter ? chapter.name : docTitle); }
        addItem(group, cells);
        continue;
      }

      var pm = /^>\s*(?:提示|场景|场景提示|Prompt)\s*[:：]\s*(.+)$/.exec(line);
      if (pm) {
        if (!group) { ensureGroup(chapter ? chapter.name : docTitle); }
        group.prompt = clean(pm[1]);
        continue;
      }
      tableRow = -1;
    }

    var groups = [];
    chapters.forEach(function (ch) {
      ch.groups.forEach(function (g) {
        if (!g.items.length) { return; }
        var seen = {};                                  // 同一个板块内去重
        g.items = g.items.filter(function (it) {
          var k = it.en.toLowerCase();
          if (seen[k]) { return false; }
          seen[k] = 1; return true;
        });
        groups.push(g);
      });
      ch.groups = ch.groups.filter(function (g) { return g.items.length; });
    });

    var kept = chapters.filter(function (ch) { return ch.groups.length; });
    var n = 0;
    kept.forEach(function (ch) {
      ch.groups.forEach(function (g) { g.key = 'g' + (n++); });
    });
    return { title: docTitle, chapters: kept, groups: groups };
  }

  function buildData(results) {
    var out = { docs: [], groups: [], errors: [] };
    results.forEach(function (r, fi) {
      if (r.error) { out.errors.push({ file: r.file, message: r.error }); return; }
      var parsed = parseMarkdown(r.text, r.file);
      var count = 0;
      parsed.groups.forEach(function (g) {
        g.key = 'f' + fi + '-' + g.key;
        g.file = r.file;
        count += g.items.length;
        out.groups.push(g);
      });
      out.docs.push({ file: r.file, title: parsed.title, chapters: parsed.chapters, items: count });
    });
    if (!out.groups.length && !out.errors.length) {
      out.errors.push({ file: '', message: '没有解析出任何词条，请检查词库里的表格格式' });
    }
    return out;
  }

  /* --------------------------------------------------- 顶栏 / 视图切换 */

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    setSetting('theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { meta.setAttribute('content', theme === 'dark' ? '#0f1115' : '#f5f6f8'); }
    if (btnTheme) { btnTheme.textContent = theme === 'dark' ? '☀️' : '🌙'; }
  }
  function initTheme() {
    var t = setting('theme', '');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(t);
  }
  function toggleTheme() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  function showReview() {
    libViewEl.hidden = true;
    reviewEl.hidden = false;
    tabReview.classList.add('on');
    tabLib.classList.remove('on');
  }
  function showLib() {
    if (!DATA) { return; }
    reviewEl.hidden = true;
    libViewEl.hidden = false;
    tabLib.classList.add('on');
    tabReview.classList.remove('on');
    if (!libList.innerHTML) { renderLib(); }
  }

  function updateDirButton() {
    var d = DIRS.filter(function (x) { return x.id === S.dir; })[0] || DIRS[0];
    if (btnDir) { btnDir.textContent = d.label; }
  }
  function cardDir() { return S.dir === 'mix' ? (Math.random() < .5 ? 'en2zh' : 'zh2en') : S.dir; }
  function cycleDir() {
    var i = 0;
    DIRS.forEach(function (d, n) { if (d.id === S.dir) { i = n; } });
    S.dir = DIRS[(i + 1) % DIRS.length].id;
    setSetting('direction', S.dir);
    updateDirButton();
    if (S.phase === 'card') {
      S.queue.forEach(function (c) { c.dir = cardDir(); });
      S.flipped = false;
      renderCard();
    }
  }

  /* -------------------------------------------------------------- 复习 */

  function pickGroup(excludeKey) {
    var all = DATA.groups;
    if (!all.length) { return null; }
    var fresh = all.filter(function (g) { return groupStat(g.key).runs === 0; });
    var pool = fresh.length ? fresh : all.slice();
    if (excludeKey && pool.length > 1) {
      pool = pool.filter(function (g) { return g.key !== excludeKey; });
    }
    if (!pool.length) { pool = all.slice(); }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function startGroup(g) {
    if (!g) { return; }
    showReview();
    S.group = g;
    S.phase = 'cue';
    S.queue = [];
    S.total = g.items.length;
    S.learned = 0;
    S.flipped = false;
    S.log = {};
    renderCue();
    window.scrollTo(0, 0);
  }

  function pickNew(avoid) {
    startGroup(pickGroup(avoid && S.group ? S.group.key : null));
  }

  function renderCue() {
    var g = S.group;
    var st = groupStat(g.key);
    var prompt = g.prompt || '先自己想一想：这个场景里，都有哪些说法？';

    reviewEl.innerHTML =
      '<section class="panel cue">' +
        (g.chapter && g.chapter !== g.name ? '<p class="eyebrow">' + esc(g.chapter) + '</p>' : '') +
        '<h1 class="cue-title">' + esc(g.name) + '</h1>' +
        '<p class="cue-prompt">' + esc(prompt) + '</p>' +
        '<p class="meta">' + (st.runs ? '复习过 ' + st.runs + ' 次 · ' : '还没复习过 · ') +
          '共 ' + g.items.length + ' 个说法</p>' +
        '<button class="primary big" id="cue-reveal" type="button">展开全部 ' + g.items.length + ' 个说法</button>' +
        '<div class="cue-list" id="cue-list" hidden>' +
          g.items.map(function (it) {
            return '<div class="cue-row"><div class="cue-en">' + esc(it.en) +
              (it.phonetic ? ' <span class="phon">' + esc(it.phonetic) + '</span>' : '') + '</div>' +
              '<div class="cue-zh">' + esc(it.zh) + '</div>' +
              (it.note ? '<div class="cue-note">' + esc(it.note) + '</div>' : '') + '</div>';
          }).join('') +
        '</div>' +
        '<div class="actions">' +
          '<button class="ghost" id="cue-again" type="button">换一个板块</button>' +
          '<button class="primary" id="cue-start" type="button">开始逐词自测</button>' +
        '</div>' +
      '</section>';

    var reveal = document.getElementById('cue-reveal');
    var list = document.getElementById('cue-list');
    reveal.addEventListener('click', function () {
      var opened = !list.hidden;
      list.hidden = opened;
      reveal.textContent = opened ? '展开全部 ' + g.items.length + ' 个说法' : '收起列表';
    });
    document.getElementById('cue-again').addEventListener('click', function () { pickNew(true); });
    document.getElementById('cue-start').addEventListener('click', startCards);
  }

  function startCards() {
    S.phase = 'card';
    S.queue = S.group.items.map(function (it) {
      return { item: it, dir: cardDir(), miss: 0, fuzzy: 0, ok: 0 };
    });
    S.total = S.queue.length;
    S.learned = 0;
    S.flipped = false;
    renderCard();
    window.scrollTo(0, 0);
  }

  function renderCard() {
    var card = S.queue[0];
    if (!card) { finishGroup(); return; }

    var frontLabel = card.dir === 'en2zh' ? '英文' : '中文';
    var backLabel = card.dir === 'en2zh' ? '中文' : '英文';
    var front = card.dir === 'en2zh' ? card.item.en : card.item.zh;
    var back = card.dir === 'en2zh' ? card.item.zh : card.item.en;
    var st = itemStat(S.group.key, card.item.en);
    var retry = card.miss + card.fuzzy;
    var pct = S.total ? Math.round(S.learned / S.total * 100) : 0;

    reviewEl.innerHTML =
      '<section class="panel cardpanel">' +
        '<div class="cardbar">' +
          '<span>' + esc(S.group.name) + ' · 已认识 ' + S.learned + '/' + S.total + '</span>' +
          '<span>队列 ' + S.queue.length + (retry ? ' · 本轮第 ' + (retry + 1) + ' 次' : '') + '</span>' +
        '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="card" id="card">' +
          '<div class="face">' +
            '<p class="label">' + frontLabel + '</p>' +
            '<p class="word">' + esc(front) + '</p>' +
          '</div>' +
          '<div class="answer" id="answer" hidden>' +
            '<p class="label">' + backLabel + '</p>' +
            '<p class="word small">' + esc(back) + '</p>' +
            (card.item.phonetic ? '<p class="phon">' + esc(card.item.phonetic) + '</p>' : '') +
            (card.item.note ? '<p class="note">' + esc(card.item.note) + '</p>' : '') +
          '</div>' +
          '<p class="hint" id="hint">点击卡片 / 空格 / 上滑 → 显示答案</p>' +
        '</div>' +
        '<div class="judge" hidden>' +
          '<button class="j miss" data-level="miss" type="button">忘记<kbd>1</kbd></button>' +
          '<button class="j fuzzy" data-level="fuzzy" type="button">模糊<kbd>2</kbd></button>' +
          '<button class="j ok" data-level="ok" type="button">认识<kbd>3</kbd></button>' +
        '</div>' +
        ((st.ok + st.fuzzy + st.miss)
          ? '<p class="meta center">历史：认识 ' + st.ok + ' · 模糊 ' + st.fuzzy + ' · 忘记 ' + st.miss + '</p>'
          : '') +
      '</section>';

    bindCard();
  }

  function flipCard() {
    if (S.phase !== 'card' || S.flipped) { return; }
    S.flipped = true;
    var a = document.getElementById('answer');
    var h = document.getElementById('hint');
    var j = reviewEl.querySelector('.judge');
    if (a) { a.hidden = false; }
    if (h) { h.hidden = true; }
    if (j) { j.hidden = false; }
  }

  function judge(level) {
    if (S.phase !== 'card' || !S.flipped) { return; }
    var card = S.queue.shift();
    if (!card) { return; }

    var rec = S.log[card.item.en] ||
      (S.log[card.item.en] = { en: card.item.en, zh: card.item.zh, ok: 0, fuzzy: 0, miss: 0 });
    recordItem(S.group.key, card.item.en, level);

    if (level === 'ok') { card.ok++; rec.ok++; S.learned++; }
    else if (level === 'fuzzy') { card.fuzzy++; rec.fuzzy++; S.queue.splice(Math.min(3, S.queue.length), 0, card); }
    else { card.miss++; rec.miss++; S.queue.push(card); }   // 忘记 → 本轮结束前必再考

    S.flipped = false;
    if (!S.queue.length) { finishGroup(); return; }
    renderCard();
  }

  function finishGroup() {
    S.phase = 'done';
    recordGroup(S.group.key);

    var rows = Object.keys(S.log).map(function (k) { return S.log[k]; });
    var easy = rows.filter(function (r) { return r.miss === 0 && r.fuzzy === 0; }).length;
    var hard = rows.filter(function (r) { return r.miss + r.fuzzy > 0; })
      .sort(function (a, b) { return (b.miss * 2 + b.fuzzy) - (a.miss * 2 + a.fuzzy); });

    reviewEl.innerHTML =
      '<section class="panel center">' +
        '<p class="done-emoji">✅</p>' +
        '<h1 class="cue-title">' + esc(S.group.name) + ' 完成</h1>' +
        '<p class="meta">共 ' + rows.length + ' 个说法 · 一次就认识 ' + easy + ' 个' +
          (hard.length ? ' · 需要加强 ' + hard.length + ' 个' : ' · 全部一次通过') + '</p>' +
        (hard.length
          ? '<div class="hardlist"><p class="label">需要加强</p>' +
            hard.map(function (r) {
              return '<div class="hard-row"><span class="hr-en">' + esc(r.en) + '</span>' +
                '<span class="hr-zh">' + esc(r.zh) + '</span>' +
                '<span class="hr-bad">忘记 ' + r.miss + ' · 模糊 ' + r.fuzzy + '</span></div>';
            }).join('') + '</div>'
          : '') +
        '<div class="actions wrap">' +
          '<button class="primary" id="do-next" type="button">再抽一个板块</button>' +
          '<button class="ghost" id="do-again" type="button">重学本组</button>' +
          '<button class="ghost" id="do-lib" type="button">看词库</button>' +
        '</div>' +
      '</section>';

    document.getElementById('do-next').addEventListener('click', function () { pickNew(true); });
    document.getElementById('do-again').addEventListener('click', function () { startGroup(S.group); });
    document.getElementById('do-lib').addEventListener('click', showLib);
    window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------- 卡片手势绑定 */

  function bindCard() {
    var cardEl = document.getElementById('card');
    if (!cardEl) { return; }

    cardEl.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('button')) { return; }
      flipCard();
    });
    Array.prototype.forEach.call(reviewEl.querySelectorAll('.judge .j'), function (b) {
      b.addEventListener('click', function () { judge(b.getAttribute('data-level')); });
    });

    var t = null;
    cardEl.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { t = null; return; }
      t = { x: e.touches[0].clientX, y: e.touches[0].clientY, axis: '' };
      cardEl.classList.add('dragging');
    }, { passive: true });

    cardEl.addEventListener('touchmove', function (e) {
      if (!t || e.touches.length !== 1) { return; }
      var dx = e.touches[0].clientX - t.x;
      var dy = e.touches[0].clientY - t.y;
      if (!t.axis && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
        t.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if (t.axis !== 'x' || !S.flipped) { return; }   // 竖滑交给页面滚动，横滑只在看答案后生效
      if (e.cancelable) { e.preventDefault(); }
      cardEl.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 45) + 'deg)';
      cardEl.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 320));
      cardEl.classList.toggle('swipe-ok', dx > 0);
      cardEl.classList.toggle('swipe-miss', dx < 0);
    }, { passive: false });

    cardEl.addEventListener('touchend', function (e) {
      if (!t) { return; }
      var p = e.changedTouches[0];
      var dx = p.clientX - t.x, dy = p.clientY - t.y, axis = t.axis;
      t = null;
      cardEl.style.transform = '';
      cardEl.style.opacity = '';
      cardEl.classList.remove('dragging', 'swipe-ok', 'swipe-miss');
      if (axis === 'y' && dy < -50) { flipCard(); return; }        // 上滑看答案
      if (axis === 'x' && S.flipped && Math.abs(dx) > 55) {         // 右滑认识，左滑忘记
        judge(dx > 0 ? 'ok' : 'miss');
      }
    });

    cardEl.addEventListener('touchcancel', function () {
      t = null;
      cardEl.style.transform = '';
      cardEl.style.opacity = '';
      cardEl.classList.remove('dragging', 'swipe-ok', 'swipe-miss');
    });
  }

  /* ------------------------------------------------------------ 词库页 */

  var MASKS = { en: true, zh: true, note: true };

  function initMasks() {
    var m = setting('masks', null);
    if (!m || typeof m !== 'object') { m = {}; }
    MASKS = { en: m.en !== false, zh: m.zh !== false, note: m.note !== false };
    applyMasks();
  }
  function applyMasks() {
    document.body.classList.toggle('mask-en', !MASKS.en);
    document.body.classList.toggle('mask-zh', !MASKS.zh);
    document.body.classList.toggle('mask-note', !MASKS.note);
    setSetting('masks', MASKS);
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (c) {
      c.classList.toggle('off', !MASKS[c.getAttribute('data-mask')]);
    });
  }

  function groupHtml(g) {
    var st = groupStat(g.key);
    var rows = g.items.map(function (it) {
      var s = (it.en + ' ' + it.zh + ' ' + it.note).toLowerCase();
      return '<tr class="item" data-s="' + esc(s) + '">' +
        '<td class="c-en">' + esc(it.en) +
          (it.phonetic ? ' <span class="phon">' + esc(it.phonetic) + '</span>' : '') + '</td>' +
        '<td class="c-zh">' + esc(it.zh) + '</td>' +
        '<td class="c-note">' + esc(it.note) + '</td></tr>';
    }).join('');
    return '<details class="group">' +
      '<summary><span class="g-name">' + esc(g.name) + '</span>' +
        '<span class="g-meta">' + g.items.length + ' 个' + (st.runs ? ' · 复习过 ' + st.runs + ' 次' : '') + '</span>' +
      '</summary>' +
      (g.prompt ? '<p class="g-prompt">提示：' + esc(g.prompt) + '</p>' : '') +
      '<div class="g-actions"><a class="ghost small" href="#group=' + encodeURIComponent(g.key) + '">复习这一组</a></div>' +
      '<div class="tablewrap"><table class="libtable"><tbody>' + rows + '</tbody></table></div>' +
    '</details>';
  }

  function renderLib() {
    var multi = DATA.docs.length > 1;
    var html = '';
    DATA.docs.forEach(function (doc) {
      if (multi) { html += '<h2 class="filetitle">' + esc(doc.title) + '</h2>'; }
      doc.chapters.forEach(function (ch) {
        if (!(ch.groups.length === 1 && ch.groups[0].name === ch.name)) {
          html += '<h3 class="chapter">' + esc(ch.name) + '</h3>';
        }
        ch.groups.forEach(function (g) { html += groupHtml(g); });
      });
    });
    libList.innerHTML = html;
    filterLib();
    renderProgress();
  }

  function renderProgress() {
    var total = DATA.groups.length;
    var done = DATA.groups.filter(function (g) { return groupStat(g.key).runs > 0; }).length;
    progStat.textContent = '已复习过的板块：' + done + ' / ' + total;
  }

  function filterLib() {
    var raw = (qEl.value || '').trim();
    var q = raw.toLowerCase();
    var groups = libList.querySelectorAll('details.group');
    var shown = 0, total = 0;

    Array.prototype.forEach.call(groups, function (d) {
      var hit = 0;
      Array.prototype.forEach.call(d.querySelectorAll('tr.item'), function (r) {
        total++;
        var ok = !q || (r.getAttribute('data-s') || '').indexOf(q) >= 0;
        r.hidden = !ok;
        if (ok) { hit++; }
      });
      d.hidden = hit === 0;
      if (q) { d.open = hit > 0; }
      shown += hit;
    });

    libStat.textContent = q
      ? '搜索「' + raw + '」：命中 ' + shown + ' / ' + total + ' 个词'
      : '共 ' + groups.length + ' 个板块 · ' + total + ' 个词';
  }

  libList.addEventListener('click', function (e) {
    var td = e.target.closest ? e.target.closest('td') : null;
    if (td) { td.classList.toggle('revealed'); }
  });
  qEl.addEventListener('input', filterLib);
  chipsEl.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if (!chip) { return; }
    var k = chip.getAttribute('data-mask');
    MASKS[k] = !MASKS[k];
    applyMasks();
  });
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!window.confirm('清空本机的学习进度？（只影响这个浏览器，词库不受影响）')) { return; }
    cache = { groups: {}, items: {}, settings: store().settings };
    saveStore();
    renderLib();
  });

  /* ------------------------------------------------------------ 启动 */

  function findGroup(key) {
    if (!DATA) { return null; }
    return DATA.groups.filter(function (g) { return g.key === key; })[0] || null;
  }

  function applyHash() {
    var h = location.hash || '';
    if (h.indexOf('#lib') === 0) { if (DATA) { showLib(); return true; } return false; }
    var m = /group=([^&]+)/.exec(h);
    if (m) {
      var g = findGroup(decodeURIComponent(m[1]));
      if (g) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
        startGroup(g);
        return true;
      }
    }
    return false;
  }

  function boot() {
    initTheme();
    initMasks();
    showReview();
    S.dir = setting('direction', 'en2zh');
    updateDirButton();

    // 直接读页面里那一段 <script type="text/markdown"> 词库
    var blocks = document.querySelectorAll('script[type="text/markdown"]');
    var results = [];
    Array.prototype.forEach.call(blocks, function (b, i) {
      results.push({
        file: b.getAttribute('data-name') || (blocks.length > 1 ? '词库 ' + (i + 1) : '词库'),
        text: b.textContent
      });
    });

    DATA = buildData(results);

    if (!DATA.groups.length) {
      S.phase = 'pick';
      reviewEl.innerHTML =
        '<section class="panel">' +
          '<h1 class="cue-title">词库里没有读到词</h1>' +
          '<p class="note">打开这个 html 文件，找到这两行之间的内容：' +
            '<br><code>&lt;script type="text/markdown" id="wordbank"&gt;</code> … <code>&lt;/script&gt;</code>' +
            '<br>词库就写在里面。每张卡片是一行表格，写法：</p>' +
          '<p class="note"><code>| Grande | 中杯 | 星巴克中杯 |</code></p>' +
          '<p class="note">表格上面要有 <code>### 板块名</code>（复习时随机抽取的单位）。</p>' +
          '<ul class="errlist">' + DATA.errors.map(function (e) {
            return '<li>' + esc(e.message) + '</li>';
          }).join('') + '</ul>' +
        '</section>';
      return;
    }

    if (!applyHash()) { startGroup(pickGroup(null)); }
  }

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') { return; }
    if (e.key === 'd' || e.key === 'D') { toggleTheme(); return; }
    if (e.key === 't' || e.key === 'T') { cycleDir(); return; }
    if (reviewEl.hidden) { return; }

    if (S.phase === 'card') {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); return; }
      if (S.flipped) {
        if (e.key === '1') { judge('miss'); return; }
        if (e.key === '2') { judge('fuzzy'); return; }
        if (e.key === '3') { judge('ok'); return; }
      }
      if (e.key === 'r' || e.key === 'R') { pickNew(true); }
      return;
    }
    if ((S.phase === 'cue' || S.phase === 'done') && (e.key === 'r' || e.key === 'R')) { pickNew(true); }
  });

  window.addEventListener('hashchange', applyHash);

  tabReview.addEventListener('click', showReview);
  tabLib.addEventListener('click', showLib);
  btnTheme.addEventListener('click', toggleTheme);
  btnDir.addEventListener('click', cycleDir);

  boot();
})();
</script>
</body>
</html>
